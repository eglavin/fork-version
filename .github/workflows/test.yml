name: Test Pull Request

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  test_node:
    strategy:
      matrix:
        include:
          - node: "22.18"
            os: ubuntu-latest
          - node: 24
            os: windows-latest

    name: Test Node.js v${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup PNPM, Node.js and Install Dependencies
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node }}
          cache: true
          require-lockfile: true

      - name: Run Typecheck
        run: |
          pnpm typecheck

      - name: Run Lint Check
        run: |
          pnpm lint:check

      - name: Run Format Check
        run: |
          pnpm format:check

      - name: Run Tests
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "<>"
          pnpm test:ci

      - name: Report Coverage
        if: matrix.node == '22.18' && matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request' && always()
        uses:  davelosert/vitest-coverage-report-action@v2
