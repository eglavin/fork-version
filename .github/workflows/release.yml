name: Publish Package

on:
  release:
    types: [created]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup PNPM, Node.js and Install Dependencies
        uses: pnpm/setup@v3
        with:
          node-version-file: .node-version
          cache: true
          require-lockfile: true

      - name: Build
        run: |
          pnpm build

      - name: Publish NPM Package
        run: |
          npm install -g npm@latest
          npm publish

      - name: Publish JSR Package
        run: |
          npx jsr publish --allow-slow-types

      - name: Update Summary
        run: |
          version=$(node ./dist/cli.js inspect-version)
          echo "## Released version: $version" >> $GITHUB_STEP_SUMMARY
