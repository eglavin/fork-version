name: Version Package

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pnpm-lock.yaml"
      - "README.md"
      - ".github/workflows/version.yml"
  workflow_dispatch: {}

# The default GITHUB_TOKEN isn't used, pushes are authenticated with the GitHub App token below.
permissions: {}

# Run one version bump at a time so quick successive pushes can't race to commit and tag. Queued
# runs aren't cancelled, as cancelling mid-run could leave a commit or tag unpushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest

    steps:

      - name: Create GitHub App Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.FORK_VERSION_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.FORK_VERSION_RELEASE_BOT_KEY }}

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}

      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.ref }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git User
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_USER_ID: ${{ steps.get-user-id.outputs.user-id }}
        run: |
          name="${APP_SLUG}[bot]"
          email="${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

          echo "Name: $name"
          echo "Email: $email"
          git config --global user.name "$name"
          git config --global user.email "$email"

      - name: Setup PNPM, Node.js and Install Dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          node-version-file: .node-version
          # Caching is disabled in privileged workflows to avoid cache poisoning.
          cache: false
          require-lockfile: true

      - name: Build
        run: |
          pnpm build

      - name: Bump Version
        run: |
          pnpm fork-version

      - name: Push Changes
        run: |
          git push --follow-tags origin main

      - name: Update Summary
        run: |
          version=$(node ./dist/cli.js inspect-version)
          echo "## Version bumped to $version" >> "$GITHUB_STEP_SUMMARY"