name: Publish Package

on:
  release:
    types: [created]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Manual runs may only publish from main.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup PNPM, Node.js and Install Dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          node-version-file: .node-version
          # Caching is disabled in privileged workflows to avoid cache poisoning.
          cache: false
          require-lockfile: true

      - name: Build
        run: |
          pnpm build

      - name: Publish NPM Package
        run: |
          pnpm publish --no-git-checks

      - name: Publish JSR Package
        run: |
          npx --yes jsr@0.14.3 publish --allow-slow-types

      - name: Update Summary
        run: |
          version=$(node ./dist/cli.js inspect-version)
          echo "## Released version: $version" >> $GITHUB_STEP_SUMMARY
