name: Publish Package

on:
  release:
    types: [created]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Vite+, Node.js and Install Dependencies
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true

      - name: Build
        run: |
          vp run build

      - name: Publish NPM Package
        run: |
          vp pm publish --no-git-checks

      - name: Publish JSR Package
        run: |
          npx jsr publish --allow-slow-types

      - name: Update Summary
        run: |
          version=$(node ./dist/cli.js inspect-version)
          echo "## Released version: $version" >> $GITHUB_STEP_SUMMARY
