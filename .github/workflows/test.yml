name: Test Pull Request

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  test_node:
    strategy:
      matrix:
        include:
          - node: "22.18"
            os: ubuntu-latest
          - node: 24
            os: windows-latest

    name: Test Node.js v${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Vite+, Node.js and Install Dependencies
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: ${{ matrix.node }}
          cache: true

      - name: Run Typecheck
        run: |
          vp run typecheck

      - name: Run Format, Lint and Type Aware Checks
        run: |
          vp check src

      - name: Run Tests
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "<>"
          vp run test:ci

      - name: Report Coverage
        if: matrix.node == '22.18' && matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request' && always()
        uses:  davelosert/vitest-coverage-report-action@v2
